<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nova — AI Chat</title>
<meta name="description" content="Nova, aplikasi AI chat modern: cepat, aman, dan nyaman digunakan." />
<meta name="theme-color" content="#0B0B0F" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M7 16V8l10 8V8' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind (CDN, config inline) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
        },
        colors: {
          bg: '#0B0B0F',
          card: '#16181D',
          border: '#2A2E35',
          accent: {
            DEFAULT: '#3B82F6',
            soft: 'rgba(59,130,246,.14)'
          }
        },
        borderRadius: { xl2: '20px' },
        keyframes: {
          fadein: { from:{opacity:0, transform:'translateY(6px)'}, to:{opacity:1, transform:'translateY(0)'} },
          slidein:{ from:{opacity:0, transform:'translateX(-8px)'}, to:{opacity:1, transform:'translateX(0)'} },
          popin:  { from:{opacity:0, transform:'scale(.94)'}, to:{opacity:1, transform:'scale(1)'} },
          blink:  { '0%,100%':{opacity:.25}, '50%':{opacity:1} }
        },
        animation: {
          fadein:'fadein .35s ease both',
          slidein:'slidein .3s ease both',
          popin:'popin .18s cubic-bezier(.2,.9,.3,1.2) both',
          blink:'blink 1.2s ease-in-out infinite'
        }
      }
    }
  };
</script>

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<!-- Markdown + sanitize + syntax highlight -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<!-- OCR (real, runs fully client-side) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">
<div id="app"></div>

<div id="toastHost" class="toast-host" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
